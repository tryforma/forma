appId: com.raymondzhao3000.forma
name: Search the food database and log a banana
---
- runFlow: common/open_home.yaml
- tapOn: ".*Manual.*"
- extendedWaitUntil: { visible: ".*Search Foods.*", timeout: 10000 }
- tapOn: "Search foods.*"
- inputText: "banana"
- extendedWaitUntil: { visible: ".*[Bb]anana.*", timeout: 30000 }
- takeScreenshot: 03a_search_results
- tapOn:
    text: ".*[Bb]anana.*"
    index: 1
- extendedWaitUntil: { visible: ".*Select Serving.*", timeout: 15000 }
- takeScreenshot: 03b_serving
- scrollUntilVisible: { element: ".*Add to Log.*", direction: DOWN }
- tapOn: ".*Add to Log.*"
- extendedWaitUntil: { visible: ".*Calories Left.*", timeout: 20000 }
- scrollUntilVisible: { element: ".*[Bb]anana.*", direction: DOWN }
- takeScreenshot: 03c_logged
