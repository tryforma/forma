appId: com.raymondzhao3000.forma
name: Settings, Sources, Privacy Policy and Terms open
---
- runFlow: common/open_home.yaml
- tapOn: { id: "home-settings" }
- extendedWaitUntil: { visible: "Settings[^A-Za-z0-9]*", timeout: 10000 }
- takeScreenshot: 15a_settings
- scrollUntilVisible: { element: ".*Sources.*", direction: DOWN }
- tapOn: ".*Sources.*"
- waitForAnimationToEnd
- takeScreenshot: 15b_sources
- runFlow: common/open_home.yaml
- tapOn: { id: "home-settings" }
- scrollUntilVisible: { element: "Privacy Policy[^A-Za-z0-9]*", direction: DOWN }
- tapOn: "Privacy Policy[^A-Za-z0-9]*"
- waitForAnimationToEnd
- takeScreenshot: 15c_privacy
- runFlow: common/open_home.yaml
- tapOn: { id: "home-settings" }
- scrollUntilVisible: { element: "Terms.*", direction: DOWN }
- tapOn: "Terms.*"
- waitForAnimationToEnd
- takeScreenshot: 15d_terms
