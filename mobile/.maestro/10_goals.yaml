appId: com.raymondzhao3000.forma
name: Change the daily calorie goal and see it on Home
---
- runFlow: common/open_home.yaml
- tapOn: { id: "home-settings" }
- extendedWaitUntil: { visible: "Settings[^A-Za-z0-9]*", timeout: 10000 }
- tapOn: "Daily Goals[^A-Za-z0-9]*"
- extendedWaitUntil: { visible: "Calorie Goal[^A-Za-z0-9]*", timeout: 10000 }
- takeScreenshot: 10a_goals
- tapOn:
    text: "Edit Goal[^A-Za-z0-9]*"
    index: 0
- eraseText: 6
- inputText: "1888"
- tapOn: "Save[^A-Za-z0-9]*"
- assertVisible: ".*1,?888.*"
- takeScreenshot: 10b_goal_saved
- runFlow: common/open_home.yaml
- assertVisible: ".*1,?888.*"
