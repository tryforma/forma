appId: com.raymondzhao3000.forma
name: Welcome → onboarding → sign up → paywall (prices, no free escape, no Lifetime)
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Get Started[^A-Za-z0-9]*"
    timeout: 60000
- takeScreenshot: 01a_welcome
- tapOn: "Get Started[^A-Za-z0-9]*"
# Goal
- extendedWaitUntil: { visible: "What's your primary goal\\?[^A-Za-z0-9]*", timeout: 20000 }
- tapOn: "Fat Loss[^A-Za-z0-9]*"
- tapOn: "Continue[^A-Za-z0-9]*"
# Height / weight / goal weight / age use pre-filled pickers
- extendedWaitUntil: { visible: "How tall are you\\?[^A-Za-z0-9]*", timeout: 10000 }
- tapOn: "Continue[^A-Za-z0-9]*"
- extendedWaitUntil: { visible: "What's your current weight\\?[^A-Za-z0-9]*", timeout: 10000 }
- tapOn: "Continue[^A-Za-z0-9]*"
- extendedWaitUntil: { visible: "What's your goal weight\\?[^A-Za-z0-9]*", timeout: 10000 }
- tapOn: "Continue[^A-Za-z0-9]*"
- extendedWaitUntil: { visible: "How old are you\\?[^A-Za-z0-9]*", timeout: 10000 }
- tapOn: "Continue[^A-Za-z0-9]*"
# Feature intro
- extendedWaitUntil: { visible: "Photo logging[^A-Za-z0-9]*", timeout: 10000 }
- scrollUntilVisible: { element: "Continue[^A-Za-z0-9]*", direction: DOWN }
- tapOn: "Continue[^A-Za-z0-9]*"
- extendedWaitUntil: { visible: "How active are you\\?[^A-Za-z0-9]*", timeout: 10000 }
- tapOn: "Light mover[^A-Za-z0-9]*"
- tapOn: "Continue[^A-Za-z0-9]*"
- extendedWaitUntil: { visible: "15 minutes[^A-Za-z0-9]*", timeout: 10000 }
- tapOn: "15 minutes[^A-Za-z0-9]*"
- tapOn: "Continue[^A-Za-z0-9]*"
- extendedWaitUntil: { visible: "Any dietary preferences\\?[^A-Za-z0-9]*", timeout: 10000 }
- tapOn: "No restrictions[^A-Za-z0-9]*"
- tapOn: "Continue[^A-Za-z0-9]*"
- extendedWaitUntil: { visible: "What's held you back in the past\\?[^A-Za-z0-9]*", timeout: 10000 }
- tapOn: "Not enough time[^A-Za-z0-9]*"
- tapOn: "Continue[^A-Za-z0-9]*"
- extendedWaitUntil: { visible: "Your daily calorie target[^A-Za-z0-9]*", timeout: 10000 }
- scrollUntilVisible: { element: "Continue[^A-Za-z0-9]*", direction: DOWN }
- tapOn: "Continue[^A-Za-z0-9]*"
- extendedWaitUntil: { visible: "How do you want to be coached\\?[^A-Za-z0-9]*", timeout: 10000 }
- tapOn: "Guided[^A-Za-z0-9]*"
- tapOn: "Build My Plan[^A-Za-z0-9]*"
# Labor-illusion screen moves on by itself
- extendedWaitUntil: { visible: "Your transformation roadmap[^A-Za-z0-9]*", timeout: 30000 }
- takeScreenshot: 01b_blueprint
- scrollUntilVisible: { element: "Start My Free Trial[^A-Za-z0-9]*", direction: DOWN }
- tapOn: "Start My Free Trial[^A-Za-z0-9]*"
# Sign up
- extendedWaitUntil: { visible: "Create account\\.[^A-Za-z0-9]*", timeout: 10000 }
- tapOn: "you@example\\.com[^A-Za-z0-9]*"
- inputText: "nibble-e2e+${RUN_ID}@tryforma.app"
- tapOn: "At least 6 characters[^A-Za-z0-9]*"
- inputText: "${E2E_PASSWORD}"
- tapOn: "Re-enter password[^A-Za-z0-9]*"
- inputText: "${E2E_PASSWORD}"
- hideKeyboard
- tapOn: "Create Account[^A-Za-z0-9]*"
# Paywall
- extendedWaitUntil: { visible: "Choose your plan[^A-Za-z0-9]*", timeout: 60000 }
- extendedWaitUntil: { visible: "\\$49\\.99[^A-Za-z0-9]*", timeout: 30000 }
- takeScreenshot: 01c_paywall
- assertVisible: "Annual[^A-Za-z0-9]*"
- assertVisible: "Monthly[^A-Za-z0-9]*"
- assertVisible: "\\$9\\.99[^A-Za-z0-9]*"
- assertVisible: ".*SAVE 58%.*"
- assertNotVisible: "Lifetime[^A-Za-z0-9]*"
# Plans loaded, so the free escape must be hidden
- assertNotVisible: "Continue with the free version[^A-Za-z0-9]*"
- assertVisible: "Start My Free Trial[^A-Za-z0-9]*"
- scrollUntilVisible: { element: "E2E: unlock premium[^A-Za-z0-9]*", direction: DOWN }
- tapOn: "E2E: unlock premium[^A-Za-z0-9]*"
- extendedWaitUntil: { visible: "Calories Left[^A-Za-z0-9]*", timeout: 30000 }
- takeScreenshot: 01d_home
