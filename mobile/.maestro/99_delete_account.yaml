appId: com.raymondzhao3000.forma
name: Delete the test account
---
- runFlow: common/open_home.yaml
- tapOn: { id: "home-settings" }
- scrollUntilVisible: { element: "Delete Account[^A-Za-z0-9]*", direction: DOWN }
- tapOn: "Delete Account[^A-Za-z0-9]*"
- tapOn: "Delete[^A-Za-z0-9]*"
- extendedWaitUntil: { visible: "Get Started[^A-Za-z0-9]*", timeout: 30000 }
- takeScreenshot: 99_deleted
