appId: com.raymondzhao3000.forma
name: Log a meal by hand (Manual Entry)
---
- runFlow: common/open_home.yaml
- tapOn: ".*Manual.*"
- extendedWaitUntil: { visible: ".*Search Foods.*", timeout: 10000 }
- tapOn: "Search foods.*"
- inputText: "zzqx homemade e2e stew"
- extendedWaitUntil: { visible: "No foods found|.*[Mm]anual.*", timeout: 30000 }
- takeScreenshot: 04a_no_results
- tapOn:
    text: ".*[Mm]anual.*|.*[Aa]dd [Cc]ustom.*|.*[Cc]reate.*"
    optional: true
- extendedWaitUntil: { visible: ".*Manual Entry.*", timeout: 10000 }
- tapOn: ".*e\\.g\\., Chicken Breast.*"
- inputText: "E2E Stew"
- tapOn: ".*e\\.g\\., 250.*"
- inputText: "420"
- hideKeyboard
- scrollUntilVisible: { element: ".*Add to Log.*", direction: DOWN }
- tapOn: ".*Add to Log.*"
- extendedWaitUntil: { visible: ".*Calories Left.*", timeout: 20000 }
- scrollUntilVisible: { element: ".*E2E Stew.*", direction: DOWN }
- takeScreenshot: 04b_logged
