appId: com.raymondzhao3000.forma
name: Sign out, sign back in with email, logged meals are still there
---
- runFlow: common/open_home.yaml
- tapOn: { id: "home-settings" }
- scrollUntilVisible: { element: "Sign Out[^A-Za-z0-9]*", direction: DOWN }
- tapOn: "Sign Out[^A-Za-z0-9]*"
- tapOn: { text: "Sign Out[^A-Za-z0-9]*", optional: true }
- extendedWaitUntil: { visible: "Get Started[^A-Za-z0-9]*", timeout: 20000 }
- tapOn: "I already have an account →[^A-Za-z0-9]*"
- extendedWaitUntil: { visible: "Welcome back\\.[^A-Za-z0-9]*", timeout: 10000 }
- tapOn: "you@example\\.com[^A-Za-z0-9]*"
- inputText: "nibble-e2e+${RUN_ID}@tryforma.app"
- tapOn: "••••••••[^A-Za-z0-9]*"
- inputText: "${E2E_PASSWORD}"
- hideKeyboard
- tapOn: "Sign In[^A-Za-z0-9]*"
- extendedWaitUntil:
    visible: "Calories Left|E2E: unlock premium"
    timeout: 60000
- runFlow:
    when: { visible: "E2E: unlock premium[^A-Za-z0-9]*" }
    commands: [ { tapOn: "E2E: unlock premium[^A-Za-z0-9]*" } ]
- extendedWaitUntil: { visible: "Calories Left[^A-Za-z0-9]*", timeout: 30000 }
- scrollUntilVisible: { element: ".*[Bb]anana.*|E2E Stew", direction: DOWN }
- takeScreenshot: 16_signed_back_in
