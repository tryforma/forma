appId: com.raymondzhao3000.forma
name: Export data screen counts the logged meals
---
- runFlow: common/open_home.yaml
- tapOn: { id: "home-settings" }
- tapOn: "Export Data[^A-Za-z0-9]*"
- extendedWaitUntil: { visible: "Export Summary[^A-Za-z0-9]*", timeout: 10000 }
- assertVisible: "Logged Meals[^A-Za-z0-9]*"
- takeScreenshot: 14_export
